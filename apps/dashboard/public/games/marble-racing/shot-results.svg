<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1080" viewBox="0 0 540 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3c82"/><stop offset="1" stop-color="#081530"/></linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.32" r="0.7"><stop offset="0" stop-color="#ffc220" stop-opacity="0.5"/><stop offset="1" stop-color="#ffc220" stop-opacity="0"/></radialGradient>
    <radialGradient id="gold" cx="0.34" cy="0.28" r="0.9"><stop offset="0" stop-color="#fff4c8"/><stop offset="0.42" stop-color="#ffd43b"/><stop offset="1" stop-color="#8a5d00"/></radialGradient>
    <radialGradient id="r" cx="0.34" cy="0.28" r="0.9"><stop offset="0" stop-color="#ffd9d0"/><stop offset="0.42" stop-color="#e74c3c"/><stop offset="1" stop-color="#6e1810"/></radialGradient>
    <radialGradient id="b" cx="0.34" cy="0.28" r="0.9"><stop offset="0" stop-color="#d8efff"/><stop offset="0.42" stop-color="#4dabf7"/><stop offset="1" stop-color="#123f66"/></radialGradient>
  </defs>
  <rect width="540" height="1080" fill="url(#bg)"/>
  <rect width="540" height="1080" fill="url(#burst)"/>
  <!-- confetti -->
  <g>
    <rect x="60" y="90" width="16" height="16" fill="#e74c3c" transform="rotate(20 68 98)"/>
    <rect x="460" y="120" width="16" height="16" fill="#2ecc71" transform="rotate(40 468 128)"/>
    <rect x="120" y="200" width="14" height="14" fill="#6ec1ff" transform="rotate(15 127 207)"/>
    <rect x="420" y="240" width="14" height="14" fill="#da77f2" transform="rotate(50 427 247)"/>
    <circle cx="90" cy="320" r="8" fill="#ffd43b"/><circle cx="455" cy="350" r="8" fill="#ffd43b"/>
  </g>
  <text x="270" y="130" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#ffc220" text-anchor="middle">YOU WIN!</text>
  <text x="270" y="172" font-family="Arial" font-size="24" fill="#6ec1ff" text-anchor="middle">Lucky took the checkered flag</text>
  <!-- podium -->
  <g>
    <!-- 2nd -->
    <rect x="60" y="500" width="130" height="240" rx="16" fill="#16306b"/>
    <text x="125" y="560" font-family="Arial Black" font-size="48" font-weight="900" fill="#6ec1ff" text-anchor="middle">2</text>
    <circle cx="125" cy="448" r="46" fill="url(#r)"/><ellipse cx="109" cy="430" rx="15" ry="10" fill="#fff" opacity="0.9"/>
    <text x="125" y="610" font-family="Arial Black" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">DASH</text>
    <!-- 1st -->
    <rect x="205" y="420" width="130" height="320" rx="16" fill="#1d3a78"/>
    <text x="270" y="496" font-family="Arial Black" font-size="64" font-weight="900" fill="#ffc220" text-anchor="middle">1</text>
    <circle cx="270" cy="338" r="58" fill="url(#gold)"/><ellipse cx="250" cy="316" rx="19" ry="13" fill="#fff" opacity="0.95"/>
    <!-- winner crown icon -->
    <g transform="translate(270 268)">
      <path d="M-30 8 L-30 -16 L-15 -4 L0 -22 L15 -4 L30 -16 L30 8 Z" fill="#ffc220" stroke="#8a5d00" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-30" cy="-16" r="4.5" fill="#ffc220" stroke="#8a5d00" stroke-width="2"/>
      <circle cx="0" cy="-22" r="4.5" fill="#ffc220" stroke="#8a5d00" stroke-width="2"/>
      <circle cx="30" cy="-16" r="4.5" fill="#ffc220" stroke="#8a5d00" stroke-width="2"/>
    </g>
    <text x="270" y="552" font-family="Arial Black" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">LUCKY</text>
    <!-- 3rd -->
    <rect x="350" y="540" width="130" height="200" rx="16" fill="#16306b"/>
    <text x="415" y="600" font-family="Arial Black" font-size="44" font-weight="900" fill="#cd7f32" text-anchor="middle">3</text>
    <circle cx="415" cy="492" r="42" fill="url(#b)"/><ellipse cx="401" cy="476" rx="13" ry="9" fill="#fff" opacity="0.9"/>
    <text x="415" y="648" font-family="Arial Black" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">SPIKE</text>
  </g>
  <!-- payout card -->
  <rect x="40" y="800" width="460" height="130" rx="24" fill="#0f244f" stroke="#2ecc71" stroke-width="3"/>
  <text x="70" y="852" font-family="Arial" font-size="22" fill="#6ec1ff">BET PAYOUT  ·  9.5x</text>
  <circle cx="92" cy="892" r="26" fill="url(#gold)"/>
  <text x="92" y="903" font-family="Arial Black" font-size="26" font-weight="900" fill="#8a5d00" text-anchor="middle">$</text>
  <text x="134" y="903" font-family="Arial Black" font-size="44" font-weight="900" fill="#2ecc71">+4,750</text>
  <!-- race again -->
  <rect x="40" y="954" width="460" height="86" rx="24" fill="#ffc220"/>
  <text x="270" y="1008" font-family="Arial Black" font-size="30" font-weight="900" fill="#0a1a3a" text-anchor="middle">RACE AGAIN</text>
</svg>
