name: Build Mobile APK

# Builds the Donkey Ideas admin app APK with Gradle directly on a GitHub
# runner — no EAS build minutes used. Triggered manually from the Actions tab.

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_DOTENV: 1
          EXPO_ROUTER_APP_ROOT: ./app

      - name: Install signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/debug.keystore
          echo "Keystore installed ($(wc -c < android/app/debug.keystore) bytes)"

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_NO_DOTENV: 1
          EXPO_ROUTER_APP_ROOT: ./app
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: donkey-ideas-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
